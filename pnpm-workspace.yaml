allowBuilds:
  # Resolver usado por tooling de ESLint; no hace falta su build nativo
  # para nada de lo que usa este repo. Quedaba como TODO sin resolver.
  unrs-resolver: false
  # NO agregar acá "kalai-checkin". Desde el 2026-09-02 ese paquete se
  # distribuye con dist/ ya compilado y sin script "prepare", así que no
  # ejecuta nada al instalarse y no necesita permiso de build.
  #
  # Tampoco volver a ponerle un "prepare": compilar al instalarse rompe
  # este deploy. Vercel ubica el store de pnpm DENTRO del proyecto
  # (/vercel/path0/.pnpm-store), el prepare corre un pnpm install en un
  # temp dir de ese store, ese install encuentra la raíz de este repo y lo
  # reinstala entero, lo que vuelve a preparar el paquete: recursión
  # infinita hasta ERR_PNPM_EEXIST. Ver el CHANGELOG, entrada del
  # 2026-09-02.
